<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal de Runes · Aletheia</title>
<style>
:root{--bg:#060a18;--panel:#0f1634;--text:#f7f4ff;--muted:#b8b9d6;--violet:#7B5CFF;--gold:#f4c842}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(123,92,255,.18),transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#fff;text-decoration:none;border:1px solid #40376c;padding:9px 12px;border-radius:999px}
h1{font-family:Georgia,serif;font-size:44px;margin:24px 0 8px}.sub{color:var(--muted);margin-bottom:24px}.entry{background:rgba(15,22,52,.9);border:1px solid #2b2f59;border-radius:18px;padding:18px;margin:14px 0}.date{font-size:12px;color:var(--gold)}.q{font-weight:700;margin:8px 0 14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#090f26;border:1px solid #272d52;border-radius:14px;padding:12px}.card img{width:100%;max-height:260px;object-fit:contain;border-radius:10px}.pos{font-size:11px;color:#dbcaff;margin-top:8px}.name{font-size:18px;font-weight:800;margin-top:3px}.keys{font-size:12px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #4b4280;background:rgba(123,92,255,.10);color:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.empty{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body><main><div class="top"><a href="/journal-runes.html">← Présentation du Journal</a><a href="/tirage-runes.html">ᚱ Nouveau tirage</a></div><h1>Journal de Runes</h1><div class="sub">Tes tirages sauvegardés depuis l’Oracle d’Aletheia.</div><div id="list"></div></main>
<script>
(function(){
var KEY='nyxia:runes:journal',list=document.getElementById('list');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function render(){var a=load();if(!a.length){list.innerHTML='<div class="empty">Aucun tirage sauvegardé pour le moment.</div>';return}
list.innerHTML=a.map(function(p,idx){var d=new Date(p.createdAt||Date.now()).toLocaleString('fr-CA');return '<article class="entry"><div class="date">'+esc(d)+'</div><div class="q">'+esc(p.question||'Message général')+'</div><div class="cards">'+(p.cards||[]).map(function(c){return '<div class="card"><img src="'+esc(c.image)+'" alt="'+esc(c.name)+'"><div class="pos">'+esc(c.position)+'</div><div class="name">'+esc(c.name)+'</div><div class="keys">'+esc(c.keywords)+'</div></div>'}).join('')+'</div><div class="tools"><button class="btn" data-ask="'+idx+'">ᚱ Interpréter avec Aletheia</button><button class="btn" data-del="'+idx+'">🗑 Supprimer</button></div></article>'}).join('');
[].slice.call(document.querySelectorAll('[data-del]')).forEach(function(b){b.onclick=function(){var a=load();a.splice(Number(b.dataset.del),1);save(a);render()}});
[].slice.call(document.querySelectorAll('[data-ask]')).forEach(function(b){b.onclick=function(){var p=load()[Number(b.dataset.ask)];sessionStorage.setItem('nyxia:aletheia:rune-reading',JSON.stringify(p));location.href='/chat-aletheia.html?source=runes'}});
}
render();
})();
</script></body></html>
