<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Journal des cartes — Cassandre</title><style>
:root{--gold:#e7c27d;--text:#f4eefb}*{box-sizing:border-box}body{margin:0;background:#0A1628;color:var(--text);font:15px/1.5 system-ui,Arial,sans-serif}#starry-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;background:transparent}main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:24px 18px 70px}h1{font:normal 44px Georgia,serif;color:var(--gold)}h2{font:normal 24px Georgia,serif;color:var(--gold)}.sub{color:#c6bad6}.entry{margin:18px 0;padding:22px;background:rgba(15,22,52,.40);border:1px solid rgba(226,193,125,.32);border-radius:18px;backdrop-filter:blur(8px)}.date{font-size:13px;color:var(--gold)}.cards{display:flex;gap:14px;flex-wrap:wrap}.card{max-width:146px;flex:1 1 100px;text-align:center}.card img{width:100%;height:175px;object-fit:contain}.pos{font-size:12px;color:#cab4ef}.name{font-weight:bold}button,.btn{display:inline-block;cursor:pointer;margin:6px 7px 6px 0;padding:11px 16px;border-radius:12px;color:#fff;background:rgba(124,94,187,.18);border:1px solid var(--gold);box-shadow:inset 0 1px 0 #ffffff25;text-decoration:none;backdrop-filter:blur(10px)}button:hover,.btn:hover{background:rgba(124,94,187,.38)}.empty{padding:40px 10px;color:#d2cde4;text-align:center}.reading{white-space:pre-wrap;color:#e3dfed;margin-top:12px}
</style></head><body><canvas id="starry-canvas"></canvas><main><a class="btn" href="/tirage-cartes.html">← Retour au tirage</a><h1>Mon Journal des cartes</h1><p class="sub">Retrouve tes tirages de cartomancie et leurs interprétations.</p><div id="entries"></div></main><script src="/js/starry-bg.js"></script><script>
(function(){var KEY='nyxia:cartes:journal';var box=document.getElementById('entries');function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}function display(){var a=load();if(!a.length){box.innerHTML='<div class="empty">Aucun tirage enregistré pour le moment.</div>';return;}box.innerHTML=a.map(function(p,i){var date=new Date(p.createdAt||Date.now()).toLocaleString('fr-CA');var cards=(p.cards||[]).map(function(c){return '<div class="card"><img alt="'+esc(c.name)+'" src="/images/cartes/'+encodeURIComponent(c.id)+'.png"><div class="pos">'+esc(c.position)+'</div><div class="name">'+esc(c.name)+(c.reversed?' · Renversée':'')+'</div></div>'}).join('');var r=p.interpretation||{};return '<article class="entry"><div class="date">'+esc(date)+'</div><h2>'+esc(p.method||'Tirage')+'</h2><p>'+esc(p.deck||'')+'</p><p><strong>Question :</strong> '+esc(p.question||'Question générale')+'</p><div class="cards">'+cards+'</div><div class="reading">'+esc(r.overview||'')+'</div><div class="reading">'+esc(r.associations||'')+'</div><div class="reading">'+esc(r.combinations||'')+'</div><div class="reading">'+esc(r.synthesis||'')+'</div><button data-ask="'+i+'">🃏 Discuter de ce tirage avec Cassandre</button><button data-remove="'+i+'">Supprimer ce tirage</button></article>'}).join('');box.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){if(!confirm('Supprimer ce tirage du Journal ?'))return;var arr=load();arr.splice(Number(b.dataset.remove),1);localStorage.setItem(KEY,JSON.stringify(arr));display()}});box.querySelectorAll('[data-ask]').forEach(function(b){b.onclick=function(){var p=load()[Number(b.dataset.ask)];if(!p)return;var t='Cassandre, interprète ce tirage dans notre conversation habituelle, sans démarrer de formation.\nMéthode : '+p.method+'\nJeu : '+p.deck+'\nQuestion : '+(p.question||'Question générale')+'\n'+(p.cards||[]).map(function(c){return c.position+' : '+c.name+(c.reversed?' (renversée)':'')}).join('\n');sessionStorage.setItem('nyxia:cassandre:tirage-en-attente',JSON.stringify({createdAt:Date.now(),message:t}));location.href='/chat-cassandre.html';}});}
display();})();
</script></body></html>
