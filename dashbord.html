<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/FavIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyXia — Portail Léna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/FavIcon.png">

  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <canvas id="starry-canvas"></canvas>

  <header>
    <button type="button" id="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Ouvrir le menu">☰</button>
    <div class="header-brand">
      <img src="/images/NyXia.png" alt="NyXia">
      <div class="brand-info">
        <div class="brand-name">NyXia IA</div>
        <div class="brand-status">En ligne</div>
      </div>
    </div>
    <div class="header-center">
      <div class="welcome-text">Bienvenue dans Portail Holistique Léna ✦ <strong id="header-username"></strong></div>
    </div>
    <div class="header-actions">
      <span class="btn-header btn-pro">✦ Portail Holistique Léna</span>
      <button class="btn-header btn-pro" onclick="window.location.href='/mot-de-passe.html'">🔐 Mot de passe</button>
      <button class="btn-header btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="app-body">
    <div id="mobile-menu-backdrop" onclick="closeMobileMenu()" aria-hidden="true"></div>
    <aside>
      <!-- Page Média -->
      <div class="panel" id="panel-medias" style="flex-direction:column"><iframe id="medias-iframe" src="about:blank" style="width:100%;height:100%;border:none;display:block" title="Média"></iframe></div>

      <!-- Panel Cercle — multi-modèles -->
    </div>
  </div>

  <script src="/js/starry-bg.js" defer></script>

  <script src="/js/dashboard.js"></script>
</body>
</html>
